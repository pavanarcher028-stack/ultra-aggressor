# Deploy to Render.com for FREE 24/7 running
# Steps: https://dashboard.render.com → New Web Service → Connect this repo
services:
  - type: web
    name: ultra-aggressor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python production_aggressor.py --dashboard
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
